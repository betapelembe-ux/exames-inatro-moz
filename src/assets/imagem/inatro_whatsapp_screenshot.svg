        <rect x="0" y="0" width="28" height="20" fill="#ffffff" rx="2" />
        <text x="14" y="15" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">7</text>

        <rect x="195" y="0" width="55" height="20" fill="#000000" rx="2" />
        <text x="222" y="15" font-size="13" font-family="monospace" font-weight="bold" fill="#4ade80" text-anchor="middle">00:02</text>

        <!-- Question text box -->
