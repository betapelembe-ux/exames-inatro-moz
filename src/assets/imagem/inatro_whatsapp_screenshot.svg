        <text x="6" y="38" font-size="10" font-weight="bold" fill="#0f172a">Que deve fazer o condutor perante</text>
        <text x="6" y="51" font-size="10" font-weight="bold" fill="#0f172a">a marca rodoviária de cor branca?</text>
