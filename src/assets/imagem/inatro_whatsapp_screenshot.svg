      <g transform="translate(0, 78)">
        <g transform="translate(0, 0)">
          <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
          <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">A</text>
          <rect x="36" y="0" width="444" height="26" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
          <text x="44" y="13" font-size="9.5" fill="#1e293b" font-weight="500">Manter-se na via de trânsito que ela delimita, só podendo ser pisada ou</text>
          <text x="44" y="23" font-size="9.5" fill="#1e293b" font-weight="500">transposta para efectuar manobras.</text>
        </g>
        <g transform="translate(0, 30)">
          <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
          <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">B</text>
          <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
          <text x="44" y="16" font-size="9.5" fill="#1e293b" font-weight="500">Manter-se na via de trânsito que ela delimita, não podendo ser pisada ou transposta.</text>
        </g>
        <g transform="translate(0, 58)">
          <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
          <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">C</text>
          <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
          <text x="44" y="16" font-size="9.5" fill="#1e293b" font-weight="500">Manter-se na via de trânsito que ela delimita, devendo abrandar a marcha.</text>
        </g>
