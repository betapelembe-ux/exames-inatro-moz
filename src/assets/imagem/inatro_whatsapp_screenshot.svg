        <circle cx="11" cy="3" r="2.5"/>
        <circle cx="3" cy="8" r="2.5"/>
        <circle cx="11" cy="8" r="2.5"/>
        <circle cx="3" cy="13" r="2.5"/>
        <circle cx="11" cy="13" r="2.5"/>
