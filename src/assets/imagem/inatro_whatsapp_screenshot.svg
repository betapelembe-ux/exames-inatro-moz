          <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
          <text x="44" y="16" font-size="10.5" fill="#1e293b" font-weight="500">Diminui, excepto nas descidas.</text>
        </g>
        <g transform="translate(0, 54)">
          <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
          <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">C</text>
          <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
          <text x="44" y="16" font-size="10.5" fill="#1e293b" font-weight="500">Aumenta.</text>
