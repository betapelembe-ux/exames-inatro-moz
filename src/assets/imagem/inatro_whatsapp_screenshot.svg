<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1140" width="540" height="1140" style="background:#0a0d14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21582e" />
      <stop offset="100%" stop-color="#2d773f" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-2%" width="110%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ==================== PAGE 1 ==================== -->
  <g id="page-1">
    <rect x="20" y="15" width="500" height="525" rx="4" fill="#ffffff" stroke="#256e35" stroke-width="2" />

    <!-- Top partial option list (from question 3) -->
    <g transform="translate(30, 25)">
      <g transform="translate(0, 0)">
        <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
        <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">A</text>
        <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
        <text x="44" y="16" font-size="11" fill="#1e293b" font-weight="600">40 metros.</text>
      </g>
      <g transform="translate(0, 28)">
        <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
        <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">B</text>
        <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
        <text x="44" y="16" font-size="11" fill="#1e293b" font-weight="600">30 metros.</text>
      </g>
      <g transform="translate(0, 56)">
        <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
        <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">C</text>
        <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
        <text x="44" y="16" font-size="11" fill="#1e293b" font-weight="600">50 metros.</text>
      </g>
      <g transform="translate(0, 84)">
        <circle cx="16" cy="12" r="11" fill="#ffffff" stroke="#21582e" stroke-width="2"/>
        <text x="16" y="16" font-size="12" font-weight="bold" fill="#21582e" text-anchor="middle">D</text>
        <rect x="36" y="0" width="444" height="24" rx="3" fill="#ffffff" stroke="#21582e" stroke-width="1.5"/>
        <text x="44" y="16" font-size="11" fill="#1e293b" font-weight="600">60 metros.</text>
      </g>
    </g>

    <!-- QUESTION 4 -->
