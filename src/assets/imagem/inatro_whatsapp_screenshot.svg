        <!-- Truck trailer with industrial pipes -->
        <rect x="35" y="24" width="60" height="26" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
        <circle cx="45" cy="35" r="7" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
        <circle cx="60" cy="35" r="7" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
        <circle cx="75" cy="35" r="7" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
